name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build Lectern.app
        run: bash build.sh

      - name: Zip the app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Lectern.app Lectern-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lectern-mac
          path: build/Lectern-mac.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest build/Lectern-mac.zip \
            --repo "${{ github.repository }}" \
            --title "Lectern (latest build)" \
            --notes "Unzip, then right-click Lectern.app and choose Open the first time."
